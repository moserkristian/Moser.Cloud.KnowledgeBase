name: Build, Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_PREFIX: ${{ github.repository_owner }}/moser-ragai

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: false

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity minimal
        env:
          ASPNETCORE_ENVIRONMENT: CI
          DOTNET_ENVIRONMENT: CI

  docker-build:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }} \
            -t ghcr.io/${{ env.IMAGE_PREFIX }}/web:latest \
            -f src/Web/Dockerfile \
            .

          docker push ghcr.io/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_PREFIX }}/web:latest

  deploy:
    if: github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          APP_NAME="web"

          if az containerapp show \
              --name ${APP_NAME} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              &>/dev/null; then

            echo "Updating ${APP_NAME}..."

            az containerapp registry set \
              --name ${APP_NAME} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --server ghcr.io \
              --username ${{ github.actor }} \
              --password ${{ secrets.GHCR_TOKEN }}

            az containerapp update \
              --name ${APP_NAME} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ghcr.io/${{ env.IMAGE_PREFIX }}/web:latest
          else
            echo "Creating ${APP_NAME}..."

            az containerapp create \
              --name ${APP_NAME} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --environment ${{ secrets.AZURE_CONTAINER_ENV }} \
              --image ghcr.io/${{ env.IMAGE_PREFIX }}/web:latest \
              --target-port 8080 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.25 \
              --memory 0.5Gi \
              --registry-server ghcr.io \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GHCR_TOKEN }}
          fi

      - name: Get Application URL
        run: |
          FQDN=$(az containerapp show \
            --name web \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "Web: https://${FQDN}"
